version: '3.4'
volumes:
  prometheus-data:
  grafana-data:
  
services:
       
  db_mongo:
    image: mongo:6.0.9
    command: mongod --port 27020
    container_name: db_mongo
    networks:
      oecc_network:
        ipv4_address: 10.5.0.3
    restart: always
    ports:
      - "27020:27020"
    environment:
      MONGO_INITDB_ROOT_USERNAME: dbadmin
      MONGO_INITDB_ROOT_PASSWORD: ruben.1234
    volumes:
      - ./data:/data/db

  oecc_server:
    image: rdroge/oecc_server:1.3.0
    container_name: oecc_server
    hostname: oecc_server
    networks:
      oecc_network:
        ipv4_address: 10.5.0.4
    ports:
      - "8050:8050"
    environment:
      WAIT_HOSTS: db_mongo:27020
      WAIT_TIMEOUT: 480

  db_mttenant:
    image: rdroge/mtdb_oecc:12.8.3-1.3.0
    user: root
    hostname: db_mttenant
    networks:
      oecc_network:
        ipv4_address: 10.5.0.5
    container_name: db_mttenant
    environment:
      - OECC_AGENT=/usr/oecc_agent/
      - DB_BROKER_PORT=37000
      - DB_MINPORT=4100
      - DB_MAXPORT=4200
    ports:
      - "37000:37000"
      - "37010:37010"
      - "14001-14100:14001-14100"
      - "4100-4200:4100-4200"
    volumes: 
    # map local cfg file to cfg file in the image
      - ./licenses/12.8/progress.cfg:/psc/dlc/progress.cfg
    depends_on:
      - oecc_server

  pas_mttenant:
    image: rdroge/mtpas_oecc:12.8.3-1.3.0
    container_name: pas_mttenant
    hostname: pas_mttenant
    environment:
      - OECC_AGENT=/usr/oecc_agent/
      - PROCFG=/usr/dlc/progress.cfg
    networks:
      oecc_network:
        ipv4_address: 10.5.0.6
    ports:
      - "8220-8223:8220-8223"
    volumes:
      - ./logs:/app/pas/prodpas/logs
      - ./licenses/12.8/progress.cfg:/usr/dlc/progress.cfg
    depends_on:
      - db_mttenant

  collector:
    restart: always  
    container_name: collector
    user: "0"
    networks:
      oecc_network:
        ipv4_address: 10.5.0.7
    image: otel/opentelemetry-collector:latest
    # command: ["--config=/conf/collector-config.yaml"]
    volumes:
      - ./oTelCollector/conf/grafana_prometheus_otel.yaml:/etc/otelcol/config.yaml
    ports:
      - "9464:9464"
      - "4317:4317"
      - "4318:4318"

  # Prometheus
  prometheus:
    restart: always  
    image: prom/prometheus:latest
    volumes:
      - ./oTelCollector/conf/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      oecc_network:
        ipv4_address: 10.5.0.8
    ports:
      - "9090:9090"

  # Grafana
  grafana:
    restart: always  
    image: grafana/grafana:latest
    networks:
      oecc_network:
        ipv4_address: 10.5.0.9
    ports:
      - 3000:3000
    volumes:
    - grafana-data:/var/lib/grafana

  jaeger:
    image: jaegertracing/all-in-one:1.35
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      oecc_network:
        ipv4_address: 10.5.0.10
    ports:
      - "5317-5318:4317-4318"
      - "16685-16686:16685-16686"
    
networks:
  oecc_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16
          gateway: 10.5.0.1   






 


  
      


    


      